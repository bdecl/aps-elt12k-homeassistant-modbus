name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # pymodbus only for the simulated device
      - run: pip install "modbus-connection[tmodbus]==4.12.3" pymodbus pytest pytest-asyncio
      - run: pytest -q tests

  tests-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Oldest supported Home Assistant (2026.10.0) and the requirements of its
      # modbus integration, which the test harness does not install by itself.
      # The simulated device needs pymodbus 3.16 or newer.
      - run: >-
          pip install pytest-homeassistant-custom-component==0.13.371
          "modbus-connection[tmodbus]==4.12.3" tmodbus==0.6.2 "pymodbus>=3.16"
      - run: cd tests_ha && pytest -q --rootdir=. .
