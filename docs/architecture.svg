<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">How the integration fits together</title>
  <desc id="d">Inside Home Assistant, the integration creates one device for the ELT with its measurements and its controls: power setpoint and SoC reserves. It reaches the ELT over Modbus TCP on port 502, on the wired interface only, through Home Assistant's shared Modbus connection. The optional self-consumption package reads a grid meter and writes the power setpoint. The ELT talks to the battery's BMS over CAN and to the house and grid over AC.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ha { fill: #eef6fc; stroke: #18bcf2; stroke-width: 1.5; }
    .grp { fill: #ffffff; stroke: #9cd8f2; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .key { fill: #fff8e1; stroke: #f2b417; stroke-width: 1.5; }
    .dev { fill: #f3f0ff; stroke: #8b7bd8; stroke-width: 1.5; }
    .h1 { font: 700 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b6a92; }
    .title { font: 600 14.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .txt { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #424a53; }
    .ctl { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9a6700; }
    .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #424a53; }
    .small { font: 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .arrow { stroke: #59636e; stroke-width: 2; fill: none; }
    .head { fill: #59636e; }
    .zig { stroke: #8b7bd8; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .zhead { fill: #8b7bd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ha { fill: #0f2433; stroke: #18bcf2; }
      .grp { fill: #0d1117; stroke: #1f6f8f; }
      .box { fill: #161b22; stroke: #3d444d; }
      .key { fill: #2b2111; stroke: #d29922; }
      .dev { fill: #1d1a33; stroke: #8b7bd8; }
      .h1 { fill: #6fd3f7; }
      .title { fill: #f0f6fc; }
      .txt, .mono { fill: #d1d7e0; }
      .ctl { fill: #e3b341; }
      .small { fill: #9198a1; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="zhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="420" rx="12"/>

  <!-- Home Assistant -->
  <rect class="ha" x="16" y="16" width="452" height="388" rx="12"/>
  <text class="h1" x="32" y="42">Home Assistant</text>

  <rect class="grp" x="28" y="54" width="428" height="196" rx="10"/>
  <text class="mono" x="42" y="74">apsystems_storage</text>

  <rect class="box" x="40" y="84" width="196" height="154" rx="8"/>
  <text class="title" x="52" y="106">Controls</text>
  <text class="ctl" x="52" y="132">Power setpoint (W)</text>
  <text class="txt" x="52" y="152">&lt; 0 charge, &gt; 0 discharge,</text>
  <text class="txt" x="52" y="170">0 standby</text>
  <text class="ctl" x="52" y="198">SoC reserve min / max</text>
  <text class="small" x="52" y="226">setpoint: register 40183</text>

  <rect class="box" x="248" y="84" width="196" height="154" rx="8"/>
  <text class="title" x="260" y="106">ELT device</text>
  <text class="txt" x="260" y="128">SoC, SoH, charge status</text>
  <text class="txt" x="260" y="146">battery and grid power</text>
  <text class="txt" x="260" y="164">per phase, energy</text>
  <text class="txt" x="260" y="182">temperatures, alarms</text>
  <text class="small" x="260" y="210">L2 / L3 only on</text>
  <text class="small" x="260" y="226">three-phase units</text>

  <rect class="key" x="28" y="272" width="208" height="118" rx="10"/>
  <text class="title" x="42" y="296">Self-consumption</text>
  <text class="title" x="42" y="314">package</text>
  <text class="txt" x="42" y="336">reads a grid meter,</text>
  <text class="txt" x="42" y="354">writes the setpoint</text>
  <text class="small" x="42" y="378">optional, every 5 s</text>

  <rect class="box" x="248" y="272" width="208" height="118" rx="10"/>
  <text class="title" x="262" y="296">Shared Modbus link</text>
  <text class="txt" x="262" y="318">HA's modbus integration</text>
  <text class="txt" x="262" y="336">one socket per host:port,</text>
  <text class="txt" x="262" y="354">requests queued</text>

  <path class="arrow" d="M120,272 V244" marker-end="url(#a)"/>
  <path class="arrow" d="M352,250 V268" marker-end="url(#a)"/>

  <!-- Modbus TCP -->
  <path class="arrow" d="M456,331 H570" marker-end="url(#a)"/>
  <path class="arrow" d="M570,345 H460" marker-end="url(#a)"/>
  <text class="small" x="514" y="300" text-anchor="middle">Modbus TCP</text>
  <text class="small" x="514" y="316" text-anchor="middle">port 502</text>
  <text class="small" x="514" y="366" text-anchor="middle">wired</text>
  <text class="small" x="514" y="382" text-anchor="middle">port only</text>

  <!-- ELT -->
  <rect class="box" x="574" y="40" width="170" height="350" rx="10"/>
  <text class="title" x="588" y="66">APsystems ELT</text>
  <text class="txt" x="588" y="90">PCS and storage</text>
  <text class="mono" xml:space="preserve" x="588" y="120">1    identity</text>
  <text class="mono" xml:space="preserve" x="588" y="140">802  storage</text>
  <text class="mono" xml:space="preserve" x="588" y="160">     40073–40183</text>
  <text class="small" x="588" y="192">one Modbus client</text>
  <text class="small" x="588" y="208">at a time</text>
  <text class="small" x="588" y="240">internal modes off</text>
  <text class="small" x="588" y="256">while Modbus is on:</text>
  <text class="small" x="588" y="272">it follows the setpoint</text>
  <text class="small" x="588" y="314">Wi-Fi: cloud and EMA</text>
  <text class="small" x="588" y="330">only, no Modbus</text>

  <!-- battery and grid -->
  <path class="zig" d="M744,130 H788" marker-end="url(#z)" marker-start="url(#z)"/>
  <path class="arrow" d="M744,300 H788" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect class="dev" x="792" y="62" width="152" height="136" rx="8"/>
  <text class="title" x="806" y="88">Battery</text>
  <text class="txt" x="806" y="110">BMS over CAN</text>
  <text class="small" x="806" y="138">the BMS sets the</text>
  <text class="small" x="806" y="154">charge and discharge</text>
  <text class="small" x="806" y="170">limits</text>

  <rect class="box" x="792" y="232" width="152" height="136" rx="8"/>
  <text class="title" x="806" y="258">House and grid</text>
  <text class="txt" x="806" y="280">AC, one or</text>
  <text class="txt" x="806" y="298">three phases</text>
  <text class="small" x="806" y="326">grid meter needed</text>
  <text class="small" x="806" y="342">for self-consumption</text>
</svg>
